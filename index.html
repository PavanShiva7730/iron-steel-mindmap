<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iron and Steel Industry in India - Interactive Mind Map (Left→Right)</title>
<style>
  /* Scope */
  #ltr-map-wrapper { font-family: "Segoe UI", Roboto, sans-serif; background:#f9fafc; margin:0; padding:0; }
  #ltr-map-wrapper h2 { text-align:center; color:#004aad; margin-top:20px; }
  #ltr-map-wrapper p  { text-align:center; color:#555; margin-bottom:20px; }

  /* Map area */
  #map {
    width:100%;
    height:550px;
    overflow:auto;
    border-radius:10px;
    border:1px solid #e0e0e0;
    background:#fff;
    padding:20px;
    box-sizing:border-box;
  }

  /* ---------- Left→Right layout ---------- */
  /* Each node wrapper aligns its children to the RIGHT of the topic */
  .box{
    position:relative;
    display:flex;               /* <-- key change: put children to the right */
    align-items:flex-start;
    gap:20px;
    margin:8px 0;
  }

  .topic{
    border-radius:12px;
    padding:8px 14px;
    display:inline-block;
    cursor:pointer;
    font-weight:600;
    color:#222;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
    transition:transform .25s ease;
    white-space:nowrap;         /* nicer LTR flow */
  }
  .topic:hover{ transform:scale(1.03); }

  /* Children stack vertically in a column ON THE RIGHT */
  .children{
    display:none;               /* toggled open/closed */
    flex-direction:column;
    gap:10px;
    margin-left:0;              /* no indent needed now */
    padding-left:0;
    border-left:none;           /* remove dashed line from old layout */
  }
  .children.open{ display:flex; }

  /* Optional subtle connector line between parent and its children column */
  .box:before{
    content:"";
    display:block;
    width:18px;                 /* small spacer that draws a link */
    height:1px;
    margin-top:18px;
    border-top:2px solid #c8ced6;
    opacity:.8;
  }

  /* Depth colors (NotebookLM-ish) */
  .depth-0 .topic{ background:linear-gradient(120deg,#c6dcf8,#d7e8ff); border-left:4px solid #2b75ff; }
  .depth-1 .topic{ background:linear-gradient(120deg,#d4f4dd,#baf3c4); border-left:4px solid #30a14e; }
  .depth-2 .topic{ background:linear-gradient(120deg,#fff2c6,#ffe59d); border-left:4px solid #e6b400; }
  .depth-3 .topic{ background:linear-gradient(120deg,#ffdce5,#ffb3c1); border-left:4px solid #e63946; }
  .depth-4 .topic{ background:linear-gradient(120deg,#e4d2ff,#d1b3ff); border-left:4px solid #8a3ffc; }

  /* Smooth appear */
  .fade-in{ animation:fadeIn .25s ease-in-out; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:translateY(0)} }

  /* Mobile – allow horizontal scroll if it overflows */
  @media (max-width: 820px){
    #map{ overflow:auto; }
  }
</style>
</head>
<body>
<div id="ltr-map-wrapper">
  <h2>Iron and Steel Industry in India</h2>
  <p>Left→right layout. Click any node to expand or collapse its children.</p>

  <div id="map"></div>
</div>

<script>
  // ---- Offline lightweight tree renderer (fixed) ----
  class PrettyMind {
    constructor(el, data) {
      this.container = document.querySelector(el);
      this.data = data.nodeData;
    }
    createNode(node, depth = 0) {
      const box = document.createElement("div");
      box.className = `box depth-${depth}`;   // ✅ fixed template string

      const topic = document.createElement("div");
      topic.className = "topic";
      topic.textContent = node.topic;
      box.appendChild(topic);

      if (node.children && node.children.length > 0) {
        const children = document.createElement("div");
        children.className = "children";      // sits to the RIGHT of topic (thanks to .box flex)
        node.children.forEach(child => {
          children.appendChild(this.createNode(child, depth + 1));
        });

        topic.addEventListener("click", () => {
          children.classList.toggle("open");
          children.classList.add("fade-in");
        });

        box.appendChild(children);
      }
      return box;
    }
    init() {
      this.container.innerHTML = "";
      const tree = this.createNode(this.data, 0);
      this.container.appendChild(tree);
    }
  }

  // ---- Data (same as yours) ----
  const data = {
    nodeData: {
      id: "root",
      topic: "Iron and Steel Industry in India",
      children: [
        {
          topic: "History and Evolution",
          children: [
            {
              topic: "Ancient Period (700 BC)",
              children: [
                { topic: "Produced wrought iron" },
                { topic: "Traditional methods (Karya furnace)" },
                { topic: "Medium carbon content" }
              ]
            },
            {
              topic: "Medieval Period (400 AD)",
              children: [
                { topic: "Iron Pillar of Delhi example" },
                { topic: "Crucible-worked wrought iron" }
              ]
            },
            {
              topic: "British Rule / Industrialization",
              children: [
                { topic: "First modern blast furnace (Calcutta, 1830s)" },
                { topic: "First successful production (1890s)" },
                { topic: "Rapid growth late 19th century" }
              ]
            },
            {
              topic: "Modern Integrated Steel",
              children: [
                { topic: "TISCO/Tata Steel incorporated (1907)" },
                { topic: "Indian Iron and Steel Co. & Mysore Steel Works" },
                { topic: "High costs, poor quality, import dependence" }
              ]
            },
            {
              topic: "Post Independence (Self-Reliance)",
              children: [
                { topic: "Government active role" },
                { topic: "Public sector enterprises with Soviet aid" },
                { topic: "Plants: Bokaro, Bhilai, Rourkela, Durgapur" }
              ]
            },
            {
              topic: "Liberalization (1990s)",
              children: [
                { topic: "Entry of private sector (Essar, JSW, Tata)" },
                { topic: "Current: One of the largest global producers" }
              ]
            }
          ]
        },
        {
          topic: "Key Features and Growth",
          children: [
            {
              topic: "Large Scale Production",
              children: [
                { topic: "2nd largest crude steel producer" },
                { topic: "Meets 95% of domestic steel needs" }
              ]
            },
            { topic: "Employment", children: [ { topic: "2 million direct & indirect jobs" } ] },
            {
              topic: "Sector Dominance",
              children: [
                { topic: "Public sector (SAIL, RINL)" },
                { topic: "Growing private firms (Tata, JSW, Essar)" }
              ]
            },
            {
              topic: "Raw Material Advantage",
              children: [
                { topic: "10% of world’s iron ore reserves" },
                { topic: "5th largest coal reserves" }
              ]
            },
            {
              topic: "Innovation Focus",
              children: [
                { topic: "Developing specialized steel grades" },
                { topic: "Cheaper raw material availability (but regulation challenges)" }
              ]
            }
          ]
        },
        {
          topic: "Major Challenges",
          children: [
            { topic: "High Production Costs", children: [ { topic: "Outdated technology" }, { topic: "High logistics expenses" } ] },
            { topic: "Import Dependence", children: [ { topic: "30% of total steel needs imported" }, { topic: "Need for high-grade/special varieties" } ] },
            { topic: "Infrastructure and Logistics", children: [ { topic: "Poor transport networks" }, { topic: "Bottlenecks, traffic jams, delays" } ] },
            { topic: "Technology and Efficiency", children: [ { topic: "Uses suboptimal processes" }, { topic: "Lower energy efficiency" } ] },
            { topic: "Environmental and Safety Issues", children: [ { topic: "High pollution (dust, gases, heat)" }, { topic: "Poor worker safety records" } ] },
            { topic: "Raw Material Shortages", children: [ { topic: "Depletion of reserves" }, { topic: "Delays in mining permissions" } ] },
            { topic: "Weak Branding & Marketing", children: [ { topic: "Forces higher-cost imports" } ] }
          ]
        },
        {
          topic: "Major Companies (Examples)",
          children: [
            { topic: "Steel Authority of India (SAIL)" },
            { topic: "Tata Steel" },
            { topic: "JSW Steel" },
            { topic: "Rashtriya Ispat Nigam Ltd (RINL)" },
            { topic: "Jindal Steel & Power (JSPL)" }
          ]
        }
      ]
    }
  };

  // ---- Initialize ----
  window.addEventListener("DOMContentLoaded", () => {
    const mind = new PrettyMind("#map", data);
    mind.init();
  });
</script>
</body>
</html>
