<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iron & Steel – Interactive Mind Map (Left→Right + Zoom)</title>
<style>
  #ltr-map-wrapper{font-family:"Segoe UI",Roboto,sans-serif;background:#f9fafc;margin:0;padding:0}
  #ltr-map-wrapper h2{text-align:center;color:#004aad;margin:16px 0 6px}
  #ltr-map-wrapper p{text-align:center;color:#555;margin:0 0 12px}

  /* Map viewport */
  #map{position:relative;width:100%;height:560px;overflow:auto;border:1px solid #e0e0e0;background:#fff;
       border-radius:10px; box-sizing:border-box;}

  /* Inner scalable layer */
  #tree{transform-origin:0 0; /* scaled via JS */ padding:20px;}

  /* Left→Right node layout */
  .box{position:relative;display:flex;align-items:flex-start;gap:20px;margin:8px 0}
  .topic{border-radius:12px;padding:8px 14px;display:inline-block;cursor:pointer;font-weight:600;color:#222;
         box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .25s ease;white-space:nowrap;background:#fff}
  .topic:hover{transform:scale(1.03)}
  .children{display:none;flex-direction:column;gap:10px}
  .children.open{display:flex}

  /* subtle link stub between a node and its children column */
  .box:before{content:"";display:block;width:18px;height:1px;margin-top:18px;border-top:2px solid #c8ced6;opacity:.8}

  /* Depth colors */
  .depth-0 .topic{background:linear-gradient(120deg,#c6dcf8,#d7e8ff); border-left:4px solid #2b75ff;}
  .depth-1 .topic{background:linear-gradient(120deg,#d4f4dd,#baf3c4); border-left:4px solid #30a14e;}
  .depth-2 .topic{background:linear-gradient(120deg,#fff2c6,#ffe59d); border-left:4px solid #e6b400;}
  .depth-3 .topic{background:linear-gradient(120deg,#ffdce5,#ffb3c1); border-left:4px solid #e63946;}
  .depth-4 .topic{background:linear-gradient(120deg,#e4d2ff,#d1b3ff); border-left:4px solid #8a3ffc;}

  .fade-in{animation:fadeIn .25s ease} @keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

  /* Zoom controls */
  .zoom-controls{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
  .zoom-controls button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;
                        box-shadow:0 2px 6px rgba(0,0,0,.06);font-weight:700}
  .zoom-readout{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid #d1d5db;border-radius:8px;
                padding:6px 10px;box-shadow:0 2px 6px rgba(0,0,0,.06);font-weight:600}
</style>
</head>
<body>
<div id="ltr-map-wrapper">
  <h2>Iron and Steel Industry in India</h2>


  <div id="map">
    <div id="tree"></div>
    <div class="zoom-controls">
      <button id="zoomOut">−</button>
      <button id="zoomReset">100%</button>
      <button id="zoomIn">+</button>
    </div>
    <div class="zoom-readout" id="zoomLabel">100%</div>
  </div>
</div>

<script>
  /* ------- Simple renderer (your original, fixed) ------- */
  class PrettyMind {
    constructor(el, data) {
      this.container = document.querySelector(el);   // #tree
      this.data = data.nodeData;
    }
    createNode(node, depth = 0) {
      const box = document.createElement("div");
      box.className = `box depth-${depth}`;

      const topic = document.createElement("div");
      topic.className = "topic";
      topic.textContent = node.topic;
      box.appendChild(topic);

      if (node.children && node.children.length > 0) {
        const children = document.createElement("div");
        children.className = "children"; // right-side column
        node.children.forEach(child => children.appendChild(this.createNode(child, depth + 1)));

        topic.addEventListener("click", (e) => {
          children.classList.toggle("open");
          children.classList.add("fade-in");
          focusNode(topic); // auto-pan to the clicked node
          e.stopPropagation();
        });

        box.appendChild(children);
      } else {
        // leaf – still center on click
        topic.addEventListener("click", (e) => { focusNode(topic); e.stopPropagation(); });
      }
      return box;
    }
    init() {
      this.container.innerHTML = "";
      const tree = this.createNode(this.data, 0);
      this.container.appendChild(tree);
    }
  }

  /* ------- Data (same as before) ------- */
  const data = {
    nodeData: {
      id: "root",
      topic: "Iron and Steel Industry in India",
      children: [
        { topic: "History and Evolution", children: [
          { topic: "Ancient Period (700 BC)", children: [
            { topic: "Produced wrought iron" },
            { topic: "Traditional methods (Karya furnace)" },
            { topic: "Medium carbon content" }
          ]},
          { topic: "Medieval Period (400 AD)", children: [
            { topic: "Iron Pillar of Delhi example" },
            { topic: "Crucible-worked wrought iron" }
          ]},
          { topic: "British Rule / Industrialization", children: [
            { topic: "First modern blast furnace (Calcutta, 1830s)" },
            { topic: "First successful production (1890s)" },
            { topic: "Rapid growth late 19th century" }
          ]},
          { topic: "Modern Integrated Steel", children: [
            { topic: "TISCO/Tata Steel incorporated (1907)" },
            { topic: "Indian Iron and Steel Co. & Mysore Steel Works" },
            { topic: "High costs, poor quality, import dependence" }
          ]},
          { topic: "Post Independence (Self-Reliance)", children: [
            { topic: "Government active role" },
            { topic: "Public sector enterprises with Soviet aid" },
            { topic: "Plants: Bokaro, Bhilai, Rourkela, Durgapur" }
          ]},
          { topic: "Liberalization (1990s)", children: [
            { topic: "Entry of private sector (Essar, JSW, Tata)" },
            { topic: "Current: One of the largest global producers" }
          ]}
        ]},
        { topic: "Key Features and Growth", children: [
          { topic: "Large Scale Production", children: [
            { topic: "2nd largest crude steel producer" },
            { topic: "Meets 95% of domestic steel needs" }
          ]},
          { topic: "Employment", children: [ { topic: "2 million direct & indirect jobs" } ] },
          { topic: "Sector Dominance", children: [
            { topic: "Public sector (SAIL, RINL)" },
            { topic: "Growing private firms (Tata, JSW, Essar)" }
          ]},
          { topic: "Raw Material Advantage", children: [
            { topic: "10% of world’s iron ore reserves" },
            { topic: "5th largest coal reserves" }
          ]},
          { topic: "Innovation Focus", children: [
            { topic: "Developing specialized steel grades" },
            { topic: "Cheaper raw material availability (but regulation challenges)" }
          ]}
        ]},
        { topic: "Major Challenges", children: [
          { topic: "High Production Costs", children: [
            { topic: "Outdated technology" },
            { topic: "High logistics expenses" }
          ]},
          { topic: "Import Dependence", children: [
            { topic: "30% of total steel needs imported" },
            { topic: "Need for high-grade/special varieties" }
          ]},
          { topic: "Infrastructure and Logistics", children: [
            { topic: "Poor transport networks" },
            { topic: "Bottlenecks, traffic jams, delays" }
          ]},
          { topic: "Technology and Efficiency", children: [
            { topic: "Uses suboptimal processes" },
            { topic: "Lower energy efficiency" }
          ]},
          { topic: "Environmental and Safety Issues", children: [
            { topic: "High pollution (dust, gases, heat)" },
            { topic: "Poor worker safety records" }
          ]},
          { topic: "Raw Material Shortages", children: [
            { topic: "Depletion of reserves" },
            { topic: "Delays in mining permissions" }
          ]},
          { topic: "Weak Branding & Marketing", children: [
            { topic: "Forces higher-cost imports" }
          ]}
        ]},
        { topic: "Major Companies (Examples)", children: [
          { topic: "Steel Authority of India (SAIL)" },
          { topic: "Tata Steel" },
          { topic: "JSW Steel" },
          { topic: "Rashtriya Ispat Nigam Ltd (RINL)" },
          { topic: "Jindal Steel & Power (JSPL)" }
        ]}
      ]
    }
  };

  /* ------- Zoom & auto-pan ------- */
  const mapEl   = document.getElementById('map');
  const treeEl  = document.getElementById('tree');
  const labelEl = document.getElementById('zoomLabel');
  const Z = {min:0.6, max:1.8, step:0.15, value:1};

  function applyZoom(){
    treeEl.style.transform = `scale(${Z.value})`;
    labelEl.textContent = Math.round(Z.value*100) + '%';
  }
  function zoomIn(){ Z.value = Math.min(Z.max, +(Z.value + Z.step).toFixed(2)); applyZoom(); }
  function zoomOut(){ Z.value = Math.max(Z.min, +(Z.value - Z.step).toFixed(2)); applyZoom(); }
  function zoomReset(){ Z.value = 1; applyZoom(); }

  document.getElementById('zoomIn').onclick  = zoomIn;
  document.getElementById('zoomOut').onclick = zoomOut;
  document.getElementById('zoomReset').onclick = zoomReset;

  // Ctrl/⌘ + wheel to zoom
  mapEl.addEventListener('wheel', (e)=>{
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      (e.deltaY > 0 ? zoomOut : zoomIn)();
    }
  }, {passive:false});

  // Center/bring node into view smoothly (works with scaling)
  function focusNode(el){
    const r = el.getBoundingClientRect();
    const c = mapEl.getBoundingClientRect();
    const dx = (r.left + r.width/2)  - (c.left + c.width/2);
    const dy = (r.top  + r.height/2) - (c.top  + c.height/2);
    mapEl.scrollBy({ left: dx, top: dy, behavior: 'smooth' });
  }

  /* ------- Init map ------- */
  window.addEventListener("DOMContentLoaded", () => {
    const mind = new PrettyMind("#tree", data);
    mind.init();
    applyZoom(); // set initial 100%
    // auto-open first layer for nicer start
    document.querySelectorAll('#tree .children').forEach((ch,i)=>{ if(i===0) ch.classList.add('open'); });
  });
</script>
</body>
</html>
